<style>

:root{
  --ivory:#FBF3E6;
  --white:#FFFDF9;
  --red:#A5303A;
  --red-dark:#7A2029;
  --gold:#CE9B3F;
  --teal:#1F4B3F;
  --ink:#2A1B14;
  --ink-soft:#6B5B4E;
  --line:#DECBAA;
  --error:#B0392F;
  --radius:14px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--ivory);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  padding:32px 16px 64px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:1100px;
}

h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  color:var(--red-dark);
  font-size:28px;
  margin:0 0 4px;
}

p.sub{
  color:var(--ink-soft);
  margin:0 0 24px;
  font-size:14px;
}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 24px;
  margin-bottom:20px;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

input[type=text],
input[type=password]{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--ivory);
  font-size:16px;
  font-family:'Work Sans',sans-serif;
}

input:focus{
  outline:none;
  border-color:var(--red);
  background:var(--white);
}

button{
  background:var(--red);
  color:var(--white);
  border:none;
  border-radius:9px;
  padding:11px 18px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  font-family:'Work Sans',sans-serif;
}

button:hover{
  background:var(--red-dark);
}

button.secondary{
  background:var(--teal);
}

button.secondary:hover{
  background:#163a30;
}

button.ghost{
  background:transparent;
  color:var(--red);
  border:1px solid var(--red);
}

button.danger{
  background:var(--error);
}

button.danger:hover{
  background:#8a2b23;
}

button.ghost-danger{
  background:transparent;
  color:var(--error);
  border:1px solid var(--error);
}

button.ghost-danger:hover{
  background:rgba(176,57,47,0.08);
}

.err{
  color:var(--error);
  font-size:13px;
  margin-top:8px;
}

.ok{
  color:var(--teal);
  font-size:13px;
  margin-top:8px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
  margin-bottom:6px;
}

.stat{
  background:var(--ivory);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-family:'Fraunces',serif;
  font-size:22px;
  color:var(--teal);
}

.stat span{
  font-size:11.5px;
  color:var(--ink-soft);
}

.status-pill{
  padding:3px 9px;
  border-radius:20px;
  font-size:11.5px;
  font-weight:600;
  display:inline-block;
}

.status-pending{
  background:#FBEEE6;
  color:#A5622F;
}

.status-paid{
  background:#E6F1EC;
  color:var(--teal);
}

.status-partial{
  background:#FDF0D5;
  color:#8A5A12;
}

.status-failed{
  background:#F8E4E2;
  color:var(--error);
}

.status-btn{
  font-size:11.5px;
  padding:5px 9px;
  border-radius:7px;
}

.hidden{
  display:none !important;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  flex-wrap:wrap;
  gap:10px;
}

.orders-wrap{
  max-height:700px;
  overflow:auto;
}

.booking-group{
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:14px;
  overflow:hidden;
}

.booking-header{
  background:var(--ivory);
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  align-items:flex-start;
  border-bottom:1px solid var(--line);
}

.booking-header .binfo b{
  font-family:'Fraunces',serif;
  font-size:15px;
  color:var(--red-dark);
}

.booking-meta{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:3px;
  line-height:1.5;
}

.booking-total{
  text-align:right;
}

.booking-total .btotal-amt{
  font-family:'Fraunces',serif;
  font-size:19px;
  color:var(--teal);
  margin-top:4px;
}

.day-table-scroll{
  overflow-x:auto;
}

.day-table{
  width:100%;
  min-width:930px;
  border-collapse:collapse;
  font-size:12.5px;
}

.day-table th,
.day-table td{
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}

.day-table th{
  background:#FBF6EC;
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.3px;
}

.day-table td.num{
  text-align:right;
}

.day-table tr:last-child td{
  border-bottom:none;
}

.booking-footer{
  padding:10px 16px;
  background:#FBF6EC;
  display:flex;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}

.payment-box{
  margin-top:8px;
  padding:8px 10px;
  background:#FBF6EC;
  border:1px solid var(--line);
  border-radius:8px;
}

.payment-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.4px;
  color:var(--ink-soft);
}

.payment-value{
  font-size:12px;
  color:var(--ink);
  margin-top:2px;
  word-break:break-all;
}

.no-order-id{
  color:#A5622F;
  font-style:italic;
}

/* ======================================================
   PAYMENT PROOF
====================================================== */

.proof-btn{
  background:var(--teal);
  color:white;
  border:none;
  padding:5px 9px;
  border-radius:7px;
  font-size:11px;
  cursor:pointer;
}

.proof-btn:hover{
  background:#163a30;
}

.no-proof{
  color:#A5622F;
  font-size:11px;
  font-style:italic;
}

.proof-thumbnail{
  width:44px;
  height:44px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid var(--line);
  vertical-align:middle;
  margin-right:5px;
  cursor:pointer;
}

/* ======================================================
   PAYMENT PROOF MODAL
====================================================== */

.proof-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:9999;
}

.proof-modal-content{
  position:relative;
  background:var(--white);
  border-radius:14px;
  padding:18px;
  max-width:900px;
  max-height:92vh;
  overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.proof-modal-content img{
  display:block;
  max-width:100%;
  max-height:75vh;
  width:auto;
  height:auto;
  margin:auto;
  border-radius:8px;
}

.proof-modal-title{
  font-family:'Fraunces',serif;
  color:var(--red-dark);
  font-size:18px;
  margin-bottom:12px;
}

.proof-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--red);
  color:white;
  border:none;
  font-size:20px;
  line-height:34px;
  padding:0;
  z-index:2;
}

.proof-close:hover{
  background:var(--red-dark);
}

@media (max-width:640px){

  body{
    padding:20px 10px 48px;
  }

  .card{
    padding:16px 14px;
  }

  h1{
    font-size:23px;
  }

  .toolbar{
    justify-content:flex-start;
  }

  .toolbar button{
    flex:1;
    min-width:0;
  }

  .booking-header{
    flex-direction:column;
    align-items:stretch;
  }

  .booking-total{
    text-align:left;
  }

  .booking-footer{
    flex-wrap:wrap;
    gap:8px;
  }

  .booking-footer button{
    flex:1;
    min-width:130px;
  }

}

</style>

<script>

(function(){


/* ======================================================
   ADMIN STATE
====================================================== */

let apiKey =
sessionStorage.getItem(
'bhogAdminKey'
) || '';


/* ======================================================
   AUTH HEADERS
====================================================== */

function authHeaders(){

return {

'x-api-key':
apiKey,

'Content-Type':
'application/json'

};

}


/* ======================================================
   PAYMENT PROOF HELPERS
====================================================== */

/*
 * Supports multiple possible backend field names.
 *
 * Your backend can return any one of these:
 *
 * paymentScreenshot
 * paymentScreenshotUrl
 * paymentProof
 * paymentProofUrl
 * screenshotUrl
 * proofOfPayment
 */

function getPaymentProof(order){

if(!order){
return null;
}


/* Direct string fields */

const possibleFields = [

'paymentScreenshot',

'paymentScreenshotUrl',

'paymentProof',

'paymentProofUrl',

'screenshotUrl',

'proofOfPayment',

'proofUrl',

'paymentProofImage',

'paymentScreenshotImage'

];


for(
const field
of possibleFields
){

const value =
order[field];

if(
typeof value === 'string' &&
value.trim()
){

return value.trim();

}

}


/* Sometimes backend may return an object */

const possibleObjects = [

order.paymentScreenshot,

order.paymentProof,

order.proofOfPayment

];


for(
const obj
of possibleObjects
){

if(
obj &&
typeof obj === 'object'
){

if(
typeof obj.url === 'string' &&
obj.url.trim()
){

return obj.url.trim();

}

if(
typeof obj.secure_url === 'string' &&
obj.secure_url.trim()
){

return obj.secure_url.trim();

}

if(
typeof obj.path === 'string' &&
obj.path.trim()
){

return obj.path.trim();

}

if(
typeof obj.data === 'string' &&
obj.data.trim()
){

return obj.data.trim();

}

}

}


return null;

}


/* ======================================================
   MAKE IMAGE URL
====================================================== */

function getProofImageUrl(
proof
){

if(!proof){
return null;
}


/*
 * Data URI:
 * data:image/png;base64,...
 */

if(
proof.startsWith(
'data:image/'
)
){

return proof;

}


/*
 * Absolute URL:
 * https://...
 */

if(
proof.startsWith(
'http://'
) ||
proof.startsWith(
'https://'
)
){

return proof;

}


/*
 * Already a relative path:
 * /uploads/payment-proof.png
 */

if(
proof.startsWith('/')
){

return proof;

}


/*
 * If backend returns a relative
 * uploads path without /
 */

return '/' + proof;

}


/* ======================================================
   SHOW PAYMENT PROOF
====================================================== */

function showPaymentProof(
proof,
orderId
){

const imageUrl =
getProofImageUrl(
proof
);

if(!imageUrl){

alert(
'No payment proof was uploaded for this order.'
);

return;

}

const modal =
document.getElementById(
'proofModal'
);

const image =
document.getElementById(
'proofModalImage'
);

const title =
document.getElementById(
'proofModalTitle'
);

title.textContent =
'Payment Proof' +
(
orderId
? ' — ' + orderId
: ''
);

image.src =
imageUrl;

modal.classList.remove(
'hidden'
);

}


/* ======================================================
   CLOSE PAYMENT PROOF
====================================================== */

function closePaymentProof(){

const modal =
document.getElementById(
'proofModal'
);

const image =
document.getElementById(
'proofModalImage'
);

modal.classList.add(
'hidden'
);

image.src =
'';

}


document
.getElementById(
'proofCloseBtn'
)
.addEventListener(
'click',
closePaymentProof
);


document
.getElementById(
'proofModal'
)
.addEventListener(
'click',
function(e){

if(
e.target === this
){

closePaymentProof();

}

});


document.addEventListener(
'keydown',
function(e){

if(
e.key === 'Escape'
){

closePaymentProof();

}

});


/* ======================================================
   INITIAL LOGIN / DASHBOARD LOAD
====================================================== */

async function tryLoad(){

const loginErr =
document.getElementById(
'loginErr'
);

loginErr.textContent = '';


try{

const res =
await fetch(
'/api/admin/stats',
{
headers:
authHeaders()
}
);


if(!res.ok){

loginErr.textContent =
'Incorrect API key.';

return false;

}


sessionStorage.setItem(
'bhogAdminKey',
apiKey
);


document
.getElementById(
'loginCard'
)
.classList
.add('hidden');


document
.getElementById(
'dashboard'
)
.classList
.remove('hidden');


await loadStats();

await loadOrders();


return true;


}catch(e){

console.error(e);

loginErr.textContent =
'Could not reach the server.';

return false;

}

}


/* ======================================================
   LOGIN BUTTON
====================================================== */

document
.getElementById(
'loginBtn'
)
.addEventListener(
'click',
function(){

apiKey =
document
.getElementById(
'apiKeyInput'
)
.value
.trim();


if(!apiKey){

document
.getElementById(
'loginErr'
)
.textContent =
'Enter your admin API key.';

return;

}


tryLoad();

}
);


/* ======================================================
   AUTO LOGIN
====================================================== */

if(apiKey){

tryLoad();

}


/* ======================================================
   LOAD STATISTICS
====================================================== */

async function loadStats(){

try{

const res =
await fetch(
'/api/admin/stats',
{
headers:
authHeaders()
}
);


if(!res.ok){

return;

}


const s =
await res.json();


document
.getElementById(
'statBookings'
)
.textContent =
Number(
s.totalBookings || 0
);


document
.getElementById(
'statOrders'
)
.textContent =
Number(
s.totalOrders || 0
);


document
.getElementById(
'statPlates'
)
.textContent =
Number(
s.totalPlates || 0
);


document
.getElementById(
'statAmount'
)
.textContent =
'₹' +
Number(
s.totalAmount || 0
).toLocaleString(
'en-IN'
);


document
.getElementById(
'statPaid'
)
.textContent =
'₹' +
Number(
s.paidAmount || 0
).toLocaleString(
'en-IN'
);


}catch(e){

console.error(
'Stats error:',
e
);

}

}


/* ======================================================
   HTML ESCAPING
====================================================== */

function escapeHtml(str){

return String(
str == null
? ''
: str
).replace(
/[&<>"']/g,
function(s){

return {

'&':
'&amp;',

'<':
'&lt;',

'>':
'&gt;',

'"':
'&quot;',

"'":
'&#39;'

}[s];

}
);

}


/* ======================================================
   GROUP BOOKINGS
====================================================== */

function groupByBooking(
orders
){

const map =
new Map();


for(
const order
of orders
){

const key =
order.bookingId ||
order.finalBookingId ||
order.orderId ||
(
order._id ||
Math.random()
);


if(
!map.has(key)
){

map.set(
key,
[]
);

}


map
.get(key)
.push(order);

}


return Array
.from(
map.values()
);

}


/* ======================================================
   PAYMENT STATUS
====================================================== */

function getGroupPaymentStatus(
group
){

const paid =
group.filter(
order =>
order.status === 'paid' ||
order.paymentStatus === 'paid' ||
order.paymentStatus === 'success'
).length;


if(
paid === group.length
){

return {

label:
'PAID',

className:
'status-paid'

};

}


if(
paid === 0
){

const failed =
group.some(
order =>
order.paymentStatus === 'failed' ||
order.status === 'failed'
);


if(failed){

return {

label:
'PAYMENT FAILED',

className:
'status-failed'

};

}


return {

label:
'PAYMENT PENDING',

className:
'status-pending'

};

}


return {

label:
'PARTIALLY PAID',

className:
'status-partial'

};

}


/* ======================================================
   RENDER BOOKING GROUP
====================================================== */

function renderBookingGroup(
group
){

const first =
group[0];


const totalAmount =
group.reduce(
function(
sum,
order
){

return (
sum +
Number(
order.amount || 0
)
);

},
0
);


const totalPlates =
group.reduce(
function(
sum,
order
){

return (
sum +
Number(
order.qty || 0
)
);

},
0
);


const payment =
getGroupPaymentStatus(
group
);


const placed =
first.createdAt
? new Date(
first.createdAt
).toLocaleString(
'en-IN'
)
: '';


const finalBookingId =
first.finalBookingId ||
first.bookingFinalId ||
first.bookingOrderId ||
(
group.find(
order =>
order.finalBookingId ||
order.bookingFinalId ||
order.bookingOrderId
) || {}
).finalBookingId ||
null;


const finalOrderId =
finalBookingId ||
first.finalOrderId ||
(
group.find(
order =>
order.finalOrderId
) || {}
).finalOrderId ||
null;


const payuTxnId =
first.payuTxnId ||
first.payuTransactionId ||
(
group.find(
order =>
order.payuTxnId ||
order.payuTransactionId
) || {}
).payuTxnId ||
null;


const payuPaymentId =
first.payuPaymentId ||
first.mihpayid ||
first.payuId ||
(
group.find(
order =>
order.payuPaymentId ||
order.mihpayid ||
order.payuId
) || {}
).payuPaymentId ||
null;


/*
 * Find payment proof at booking level.
 */

let bookingProof =
getPaymentProof(
first
);


if(!bookingProof){

const proofOrder =
group.find(
order =>
getPaymentProof(order)
);

if(proofOrder){

bookingProof =
getPaymentProof(
proofOrder
);

}

}


const wrap =
document.createElement(
'div'
);


wrap.className =
'booking-group';


wrap.innerHTML = `

<div class="booking-header">

<div class="binfo">

<b>

${
finalOrderId
? escapeHtml(
finalOrderId
)
: `
<span class="no-order-id">
Order ID generated after successful payment
</span>
`
}

</b>


<div class="booking-meta">

${escapeHtml(
first.name || ''
)}

·

${escapeHtml(
first.phone || ''
)}

·

${escapeHtml(
first.email || ''
)}

</div>


<div class="booking-meta">

${escapeHtml(
first.lunchType || ''
)}

·

Placed ${escapeHtml(
placed
)}

</div>


<div class="payment-box">

<div class="payment-label">
PayU Transaction ID
</div>

<div class="payment-value">

${
payuTxnId
? escapeHtml(
payuTxnId
)
: '—'
}

</div>

</div>


<div class="payment-box">

<div class="payment-label">
PayU Payment ID
</div>

<div class="payment-value">

${
payuPaymentId
? escapeHtml(
payuPaymentId
)
: '—'
}

</div>

</div>


${
bookingProof
? `
<div
class="payment-box"
style="display:flex;align-items:center;justify-content:space-between;gap:10px;"
>

<div>

<div class="payment-label">
Payment Proof
</div>

<div class="payment-value">
Buyer uploaded payment screenshot
</div>

</div>

<button
type="button"
class="proof-btn booking-proof-btn"
>
View Proof
</button>

</div>
`
: ''
}

</div>


<div class="booking-total">

<span
class="status-pill ${payment.className}"
>

${payment.label}

</span>


<div class="btotal-amt">

₹${totalAmount.toLocaleString('en-IN')}

</div>


<div class="booking-meta">

${totalPlates}

plate(s)

across

${group.length}

day(s)

</div>

</div>

</div>


<div
class="day-table-scroll"
>

<table
class="day-table"
>

<thead>

<tr>

<th>
Day
</th>

<th class="num">
Plates
</th>

<th class="num">
Amount
</th>

<th>
UTSAV Order ID
</th>

<th>
Payment
</th>

<th>
PayU ID
</th>

<th>
Payment Proof
</th>

<th>
</th>

</tr>

</thead>


<tbody></tbody>

</table>

</div>


<div
class="booking-footer"
></div>

`;


/* ======================================================
   BOOKING LEVEL PROOF BUTTON
====================================================== */

if(bookingProof){

const bookingProofBtn =
wrap.querySelector(
'.booking-proof-btn'
);

if(bookingProofBtn){

bookingProofBtn.addEventListener(
'click',
function(){

showPaymentProof(
bookingProof,
finalOrderId ||
first.orderId ||
''
);

}
);

}

}


/* ======================================================
   TABLE BODY
====================================================== */

const tbody =
wrap.querySelector(
'tbody'
);


for(
const order
of group
){

const tr =
document.createElement(
'tr'
);


const isPaid =
order.status === 'paid' ||
order.paymentStatus === 'paid' ||
order.paymentStatus === 'success';


const isFailed =
order.status === 'failed' ||
order.paymentStatus === 'failed';


const pillClass =
isPaid
? 'status-paid'
: (
isFailed
? 'status-failed'
: 'status-pending'
);


const statusText =
isPaid
? 'PAID'
: (
isFailed
? 'FAILED'
: 'PENDING'
);


const dayOrderId =
order.orderId ||
order.finalOrderId ||
null;


const rowPayuId =
order.payuPaymentId ||
order.mihpayid ||
order.payuId ||
payuPaymentId ||
null;


/*
 * Get proof specifically for this order.
 */

const rowProof =
getPaymentProof(
order
);


tr.innerHTML = `

<td>

${escapeHtml(
order.day || ''
)}

</td>


<td class="num">

${Number(
order.qty || 0
)}

</td>


<td class="num">

₹${Number(
order.amount || 0
).toLocaleString(
'en-IN'
)}

</td>


<td>

${
dayOrderId
? escapeHtml(
dayOrderId
)
: `
<span class="no-order-id">
Available after payment
</span>
`
}

</td>


<td>

<span
class="status-pill ${pillClass}"
>

${statusText}

</span>

</td>


<td>

${
rowPayuId
? escapeHtml(
rowPayuId
)
: '—'
}

</td>


<td class="proof-cell">

${
rowProof
? `
<button
type="button"
class="proof-btn view-row-proof"
>
View Proof
</button>
`
: `
<span class="no-proof">
No proof uploaded
</span>
`
}

</td>

`;


/* ======================================================
   VIEW PROOF BUTTON
====================================================== */

const proofBtn =
tr.querySelector(
'.view-row-proof'
);


if(proofBtn){

proofBtn.addEventListener(
'click',
function(){

showPaymentProof(
rowProof,
dayOrderId ||
finalOrderId ||
''
);

}
);

}


/* ======================================================
   ACTION BUTTON
====================================================== */

const actionTd =
document.createElement(
'td'
);


const btn =
document.createElement(
'button'
);


btn.className =
'ghost status-btn';


btn.textContent =
isPaid
? 'Mark pending'
: 'Mark paid';


const statusIdentifier =
order.orderId ||
order.finalOrderId ||
order._id ||
null;


if(statusIdentifier){

btn.addEventListener(
'click',
function(){

toggleStatus(
statusIdentifier,
isPaid
? 'paid'
: 'pending'
);

}
);

}else{

btn.disabled = true;

btn.title =
'Payment has not created a final order ID yet.';

btn.style.opacity =
'0.5';

btn.textContent =
'Awaiting payment';

}


actionTd.appendChild(
btn
);


tr.appendChild(
actionTd
);


tbody.appendChild(
tr
);

}


/* ======================================================
   FOOTER
====================================================== */

const footer =
wrap.querySelector(
'.booking-footer'
);


const bookingId =
first.bookingId ||
null;


if(bookingId){

const bulkBtn =
document.createElement(
'button'
);


bulkBtn.className =
'secondary status-btn';


const allPaid =
group.every(
order =>
order.status === 'paid' ||
order.paymentStatus === 'paid' ||
order.paymentStatus === 'success'
);


bulkBtn.textContent =
allPaid
? 'Mark whole booking pending'
: 'Mark whole booking paid';


bulkBtn.addEventListener(
'click',
function(){

toggleBookingStatus(
bookingId,
allPaid
);

}
);


footer.appendChild(
bulkBtn
);


const deleteBtn =
document.createElement(
'button'
);


deleteBtn.className =
'ghost-danger status-btn';


deleteBtn.textContent =
'Delete this booking';


deleteBtn.addEventListener(
'click',
function(){

deleteBooking(
bookingId
);

}
);


footer.appendChild(
deleteBtn
);

}


return wrap;

}


/* ======================================================
   LOAD ORDERS
====================================================== */

async function loadOrders(){

const container =
document.getElementById(
'ordersContainer'
);


const errEl =
document.getElementById(
'ordersErr'
);


errEl.textContent = '';


container.innerHTML =
`

<p
style="
color:var(--ink-soft);
font-size:13px;
"
>
Loading…
</p>

`;


try{

const res =
await fetch(
'/api/admin/orders',
{
headers:
authHeaders()
}
);


if(!res.ok){

throw new Error(
'Could not load orders'
);

}


const data =
await res.json();


const orders =
data.orders || [];


if(
orders.length === 0
){

container.innerHTML =
`

<p
style="
color:var(--ink-soft);
font-size:13px;
"
>
No bookings yet.
</p>

`;

return;

}


const groups =
groupByBooking(
orders
);


container.innerHTML =
'';


for(
const group
of groups
){

container.appendChild(
renderBookingGroup(
group
)
);

}


}catch(e){

console.error(e);


errEl.textContent =
'Could not load orders.';


container.innerHTML =
`

<p
style="
color:var(--ink-soft);
font-size:13px;
"
>
Could not load orders.
</p>

`;

}

}


/* ======================================================
   CHANGE SINGLE ORDER STATUS
====================================================== */

async function toggleStatus(
orderId,
currentStatus
){

const newStatus =
currentStatus === 'paid'
? 'pending'
: 'paid';


try{

const res =
await fetch(
`/api/admin/orders/${encodeURIComponent(orderId)}/status`,
{

method:
'POST',

headers:
authHeaders(),

body:
JSON.stringify({
status:
newStatus
})

}
);


if(!res.ok){

const result =
await res
.json()
.catch(
() => ({})
);


alert(
result.error ||
'Could not update payment status.'
);

return;

}


await loadStats();

await loadOrders();


}catch(e){

console.error(e);

alert(
'Could not reach the server.'
);

}

}

.catch(

);

);

return;

}


await loadStats();

}catch(e){

console.error(e);

alert(

);

}

}


/* ======================================================
   DELETE SINGLE BOOKING
====================================================== */

async function deleteBooking(
bookingId
){

const entered =
prompt(
`This will permanently delete booking ${bookingId} and all its day-orders.\n\nType your admin API key to confirm:`
);


if(
entered === null
){

return;

}


if(
entered !== apiKey
){

alert(
'That key did not match. Nothing was deleted.'
);

return;

}


try{

const res =
await fetch(
`/api/admin/bookings/${encodeURIComponent(bookingId)}`,
{

method:
'DELETE',

headers:
authHeaders()

}
);


if(!res.ok){

const result =
await res
.json()
.catch(
() => ({})
);


alert(
result.error ||
'Could not delete this booking.'
);

return;

}


await loadStats();

await loadOrders();


}catch(e){

console.error(e);

alert(
'Could not reach the server.'
);

}

}


/* ======================================================
   RESET ALL ORDERS
====================================================== */

async function resetAllOrders(){

const enteredKey =
prompt(
'This will PERMANENTLY DELETE every booking and order in the system.\n\nType your admin API key to confirm:'
);


if(
enteredKey === null
){

return;

}


if(
enteredKey !== apiKey
){

alert(
'That key did not match. Nothing was deleted.'
);

return;

}


const phrase =
prompt(
'Last step. Type exactly: DELETE ALL\n\n(this cannot be undone)'
);


if(
phrase === null
){

return;

}


if(
phrase !== 'DELETE ALL'
){

alert(
'That did not match "DELETE ALL". Nothing was deleted.'
);

return;

}


try{

const res =
await fetch(
'/api/admin/orders',
{

method:
'DELETE',

headers:
authHeaders(),

body:
JSON.stringify({
confirm:
'DELETE ALL'
})

}
);


const result =
await res
.json()
.catch(
() => ({})
);


if(!res.ok){

alert(
result.error ||
'Could not reset orders.'
);

return;

}


alert(
`Deleted ${result.deletedCount || 0} order(s).`
);


await loadStats();

await loadOrders();


}catch(e){

console.error(e);

alert(
'Could not reach the server.'
);

}

}


/* ======================================================
   RESET BUTTON
====================================================== */

document
.getElementById(
'resetAllBtn'
)
.addEventListener(
'click',
resetAllOrders
);


/* ======================================================
   REFRESH BUTTON
====================================================== */

document
.getElementById(
'refreshBtn'
)
.addEventListener(
'click',
async function(){

await loadStats();

await loadOrders();

}
);


/* ======================================================
   EXPORT CSV
====================================================== */

document
.getElementById(
'exportBtn'
)
.addEventListener(
'click',
async function(){

try{

const res =
await fetch(
'/api/admin/orders/export',
{
headers:
authHeaders()
}
);


if(!res.ok){

const result =
await res
.json()
.catch(
() => ({})
);


alert(
result.error ||
'Could not export orders.'
);

return;

}


const blob =
await res.blob();


const url =
URL.createObjectURL(
blob
);


const a =
document.createElement(
'a'
);


a.href =
url;


a.download =
'bhog-orders.csv';


document
.body
.appendChild(a);


a.click();


a.remove();


URL.revokeObjectURL(
url
);


}catch(e){

console.error(e);

alert(
'Could not reach the server.'
);

}

}

);

})();

</script>
