<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard — Durga Pujo Bhog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF3E6; --white:#FFFDF9; --red:#A5303A; --red-dark:#7A2029;
    --gold:#CE9B3F; --teal:#1F4B3F; --ink:#2A1B14; --ink-soft:#6B5B4E;
    --line:#DECBAA; --error:#B0392F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ivory); color:var(--ink); font-family:'Work Sans', sans-serif;
    padding:32px 16px 64px; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{ width:100%; max-width:820px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; color:var(--red-dark); font-size:28px; margin:0 0 4px; }
  p.sub{ color:var(--ink-soft); margin:0 0 24px; font-size:14px; }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:20px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=text], input[type=password]{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    background:var(--ivory); font-size:14.5px; font-family:'Work Sans', sans-serif;
  }
  input:focus{ outline:none; border-color:var(--red); background:var(--white); }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:200px; }
  button{
    background:var(--red); color:var(--white); border:none; border-radius:9px;
    padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Work Sans', sans-serif;
  }
  button:hover{ background:var(--red-dark); }
  button.secondary{ background:var(--teal); }
  button.secondary:hover{ background:#163a30; }
  button.ghost{ background:transparent; color:var(--red); border:1px solid var(--red); }
  .err{ color:var(--error); font-size:13px; margin-top:8px; }
  .ok{ color:var(--teal); font-size:13px; margin-top:8px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:6px; }
  .stat{ background:var(--ivory); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center; }
  .stat b{ display:block; font-family:'Fraunces', serif; font-size:22px; color:var(--teal); }
  .stat span{ font-size:11.5px; color:var(--ink-soft); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
  th{ background:var(--ivory); }
  td.num{ text-align:right; }
  .status-pill{ padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; }
  .status-pending{ background:#FBEEE6; color:#A5622F; }
  .status-paid{ background:#E6F1EC; color:var(--teal); }
  .status-btn{ font-size:11.5px; padding:5px 9px; border-radius:7px; }
  .hidden{ display:none !important; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .table-wrap{ overflow:auto; max-height:420px; border:1px solid var(--line); border-radius:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Seller dashboard</h1>
  <p class="sub">Manage your UPI details and review every Durga Pujo bhog order.</p>

  <div class="card" id="loginCard">
    <label for="apiKeyInput">Admin API key</label>
    <input type="password" id="apiKeyInput" placeholder="Paste your ADMIN_API_KEY">
    <div style="margin-top:12px;"><button id="loginBtn">View dashboard</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <h2 style="font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px; color:var(--red-dark);">UPI receiving details</h2>
      <div class="row">
        <div>
          <label for="upiIdInput">UPI ID</label>
          <input type="text" id="upiIdInput" placeholder="e.g. seller@okaxis">
        </div>
        <div>
          <label for="payeeNameInput">Payee name shown to devotees</label>
          <input type="text" id="payeeNameInput" placeholder="e.g. Sarbojanin Durga Puja Samiti">
        </div>
      </div>
      <div style="margin-top:14px;"><button class="secondary" id="saveSettingsBtn">Save UPI details</button></div>
      <div class="ok hidden" id="settingsMsg"></div>
    </div>

    <div class="card">
      <div class="stat-grid">
        <div class="stat"><b id="statBookings">0</b><span>Total bookings</span></div>
        <div class="stat"><b id="statOrders">0</b><span>Day-orders</span></div>
        <div class="stat"><b id="statPlates">0</b><span>Total plates</span></div>
        <div class="stat"><b id="statAmount">₹0</b><span>Amount expected</span></div>
        <div class="stat"><b id="statPaid">₹0</b><span>Amount confirmed paid</span></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="font-family:'Fraunces',serif; font-size:18px; margin:0; color:var(--red-dark);">Orders</h2>
        <div style="display:flex; gap:10px;">
          <button class="ghost" id="refreshBtn">Refresh</button>
          <button id="exportBtn">Export CSV</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Order ID</th><th>Booking ID</th><th>Day</th><th>Lunch Type</th><th>Name</th><th>Phone</th><th class="num">Plates</th><th class="num">Amount</th><th>Status</th><th>UTR</th><th>Placed</th><th>Actions</th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div class="err" id="ordersErr"></div>
    </div>
  </div>
</div>

<script>
(function(){
  let apiKey = sessionStorage.getItem('bhogAdminKey') || '';

  function authHeaders(){
    return { 'x-api-key': apiKey, 'Content-Type': 'application/json' };
  }

  async function tryLoad(){
    const loginErr = document.getElementById('loginErr');
    loginErr.textContent = '';
    try{
      const res = await fetch('/api/admin/stats', { headers: authHeaders() });
      if(!res.ok){
        loginErr.textContent = 'Incorrect API key.';
        return false;
      }
      sessionStorage.setItem('bhogAdminKey', apiKey);
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      await loadSettings();
      await loadStats();
      await loadOrders();
      return true;
    }catch(e){
      loginErr.textContent = 'Could not reach the server.';
      return false;
    }
  }

  document.getElementById('loginBtn').addEventListener('click', ()=>{
    apiKey = document.getElementById('apiKeyInput').value.trim();
    if(!apiKey){ document.getElementById('loginErr').textContent = 'Enter your admin API key.'; return; }
    tryLoad();
  });

  if(apiKey){ tryLoad(); }

  async function loadSettings(){
    try{
      const res = await fetch('/api/settings');
      const s = await res.json();
      document.getElementById('upiIdInput').value = s.upiId || '';
      document.getElementById('payeeNameInput').value = s.payeeName || '';
    }catch(e){}
  }

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('settingsMsg');
    msg.classList.remove('hidden');
    msg.textContent = 'Saving…';
    try{
      const res = await fetch('/api/admin/settings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify({
          upiId: document.getElementById('upiIdInput').value,
          payeeName: document.getElementById('payeeNameInput').value
        })
      });
      if(res.ok){ msg.textContent = 'Saved.'; }
      else{ msg.textContent = 'Could not save. Please check your API key.'; }
    }catch(e){ msg.textContent = 'Could not reach the server.'; }
  });

  async function loadStats(){
    try{
      const res = await fetch('/api/admin/stats', { headers: authHeaders() });
      const s = await res.json();
      document.getElementById('statBookings').textContent = s.totalBookings;
      document.getElementById('statOrders').textContent = s.totalOrders;
      document.getElementById('statPlates').textContent = s.totalPlates;
      document.getElementById('statAmount').textContent = '₹' + s.totalAmount.toLocaleString('en-IN');
      document.getElementById('statPaid').textContent = '₹' + s.paidAmount.toLocaleString('en-IN');
    }catch(e){}
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  async function loadOrders(){
    const body = document.getElementById('ordersBody');
    const errEl = document.getElementById('ordersErr');
    errEl.textContent = '';
    body.innerHTML = '<tr><td colspan="12">Loading…</td></tr>';
    try{
      const res = await fetch('/api/admin/orders', { headers: authHeaders() });
      const data = await res.json();
      const orders = data.orders || [];
      if(orders.length === 0){
        body.innerHTML = '<tr><td colspan="12">No orders yet.</td></tr>';
        return;
      }
      body.innerHTML = '';
      for(const o of orders){
        const tr = document.createElement('tr');
        const placed = new Date(o.createdAt).toLocaleString('en-IN');
        const pillClass = o.status === 'paid' ? 'status-paid' : 'status-pending';
        const toggleLabel = o.status === 'paid' ? 'Mark pending' : 'Mark paid';
        tr.innerHTML = `
          <td>${escapeHtml(o.orderId)}</td>
          <td>${escapeHtml(o.bookingId || '')}</td>
          <td>${escapeHtml(o.day || '')}</td>
          <td>${escapeHtml(o.lunchType || '')}</td>
          <td>${escapeHtml(o.name)}</td>
          <td>${escapeHtml(o.phone)}</td>
          <td class="num">${o.qty}</td>
          <td class="num">₹${o.amount.toLocaleString('en-IN')}</td>
          <td><span class="status-pill ${pillClass}">${o.status}</span></td>
          <td>${escapeHtml(o.utr || '—')}</td>
          <td>${placed}</td>
        `;
        const statusTd = document.createElement('td');
        const btn = document.createElement('button');
        btn.className = 'ghost status-btn';
        btn.textContent = toggleLabel;
        btn.addEventListener('click', () => toggleStatus(o.orderId, o.status));
        statusTd.appendChild(btn);
        tr.appendChild(statusTd);
        body.appendChild(tr);
      }
    }catch(e){
      errEl.textContent = 'Could not load orders.';
      body.innerHTML = '<tr><td colspan="12">Could not load orders.</td></tr>';
    }
  }

  async function toggleStatus(orderId, currentStatus){
    const newStatus = currentStatus === 'paid' ? 'pending' : 'paid';
    try{
      await fetch(`/api/admin/orders/${encodeURIComponent(orderId)}/status`, {
        method:'POST', headers: authHeaders(), body: JSON.stringify({ status: newStatus })
      });
      await loadStats();
      await loadOrders();
    }catch(e){}
  }

  document.getElementById('refreshBtn').addEventListener('click', ()=>{ loadStats(); loadOrders(); });

  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    try{
      const res = await fetch('/api/admin/orders/export', { headers: authHeaders() });
      if(!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bhog-orders.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){}
  });
})();
</script>
</body>
</html>
