<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard — Durga Pujo Bhog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF3E6; --white:#FFFDF9; --red:#A5303A; --red-dark:#7A2029;
    --gold:#CE9B3F; --teal:#1F4B3F; --ink:#2A1B14; --ink-soft:#6B5B4E;
    --line:#DECBAA; --error:#B0392F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ivory); color:var(--ink); font-family:'Work Sans', sans-serif;
    padding:32px 16px 64px; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{ width:100%; max-width:900px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; color:var(--red-dark); font-size:28px; margin:0 0 4px; }
  p.sub{ color:var(--ink-soft); margin:0 0 24px; font-size:14px; }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:20px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=text], input[type=password]{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    background:var(--ivory); font-size:14.5px; font-family:'Work Sans', sans-serif;
  }
  input:focus{ outline:none; border-color:var(--red); background:var(--white); }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:200px; }
  button{
    background:var(--red); color:var(--white); border:none; border-radius:9px;
    padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Work Sans', sans-serif;
  }
  button:hover{ background:var(--red-dark); }
  button.secondary{ background:var(--teal); }
  button.secondary:hover{ background:#163a30; }
  button.ghost{ background:transparent; color:var(--red); border:1px solid var(--red); }
  .err{ color:var(--error); font-size:13px; margin-top:8px; }
  .ok{ color:var(--teal); font-size:13px; margin-top:8px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:6px; }
  .stat{ background:var(--ivory); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center; }
  .stat b{ display:block; font-family:'Fraunces', serif; font-size:22px; color:var(--teal); }
  .stat span{ font-size:11.5px; color:var(--ink-soft); }
  .status-pill{ padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; display:inline-block; }
  .status-pending{ background:#FBEEE6; color:#A5622F; }
  .status-paid{ background:#E6F1EC; color:var(--teal); }
  .status-partial{ background:#FDF0D5; color:#8A5A12; }
  .status-btn{ font-size:11.5px; padding:5px 9px; border-radius:7px; }
  .hidden{ display:none !important; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .orders-wrap{ max-height:640px; overflow:auto; }

  .booking-group{
    border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden;
  }
  .booking-header{
    background:var(--ivory); padding:14px 16px; display:flex; justify-content:space-between;
    flex-wrap:wrap; gap:12px; align-items:flex-start; border-bottom:1px solid var(--line);
  }
  .booking-header .binfo b{ font-family:'Fraunces', serif; font-size:15px; color:var(--red-dark); }
  .booking-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .booking-total{ text-align:right; }
  .booking-total .btotal-amt{ font-family:'Fraunces', serif; font-size:19px; color:var(--teal); margin-top:4px; }
  .day-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .day-table th, .day-table td{ padding:8px 12px; border-bottom:1px solid var(--line); text-align:left; }
  .day-table th{ background:#FBF6EC; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; }
  .day-table td.num{ text-align:right; }
  .day-table tr:last-child td{ border-bottom:none; }
  .booking-footer{ padding:10px 16px; background:#FBF6EC; display:flex; justify-content:flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Seller dashboard</h1>
  <p class="sub">Manage your UPI details and review every Durga Pujo bhog booking.</p>

  <div class="card" id="loginCard">
    <label for="apiKeyInput">Admin API key</label>
    <input type="password" id="apiKeyInput" placeholder="Paste your ADMIN_API_KEY">
    <div style="margin-top:12px;"><button id="loginBtn">View dashboard</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <h2 style="font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px; color:var(--red-dark);">UPI receiving details</h2>
      <div class="row">
        <div>
          <label for="upiIdInput">UPI ID</label>
          <input type="text" id="upiIdInput" placeholder="e.g. seller@okaxis">
        </div>
        <div>
          <label for="payeeNameInput">Payee name shown to devotees</label>
          <input type="text" id="payeeNameInput" placeholder="e.g. Sarbojanin Durga Puja Samiti">
        </div>
      </div>
      <div style="margin-top:14px;"><button class="secondary" id="saveSettingsBtn">Save UPI details</button></div>
      <div class="ok hidden" id="settingsMsg"></div>
    </div>

    <div class="card">
      <div class="stat-grid">
        <div class="stat"><b id="statBookings">0</b><span>Total bookings</span></div>
        <div class="stat"><b id="statOrders">0</b><span>Day-orders</span></div>
        <div class="stat"><b id="statPlates">0</b><span>Total plates</span></div>
        <div class="stat"><b id="statAmount">₹0</b><span>Amount expected</span></div>
        <div class="stat"><b id="statPaid">₹0</b><span>Amount confirmed paid</span></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="font-family:'Fraunces',serif; font-size:18px; margin:0; color:var(--red-dark);">Bookings</h2>
        <div style="display:flex; gap:10px;">
          <button class="ghost" id="refreshBtn">Refresh</button>
          <button id="exportBtn">Export CSV</button>
        </div>
      </div>
      <div class="orders-wrap" id="ordersContainer"></div>
      <div class="err" id="ordersErr"></div>
    </div>
  </div>
</div>

<script>
(function(){
  let apiKey = sessionStorage.getItem('bhogAdminKey') || '';

  function authHeaders(){
    return { 'x-api-key': apiKey, 'Content-Type': 'application/json' };
  }

  async function tryLoad(){
    const loginErr = document.getElementById('loginErr');
    loginErr.textContent = '';
    try{
      const res = await fetch('/api/admin/stats', { headers: authHeaders() });
      if(!res.ok){
        loginErr.textContent = 'Incorrect API key.';
        return false;
      }
      sessionStorage.setItem('bhogAdminKey', apiKey);
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      await loadSettings();
      await loadStats();
      await loadOrders();
      return true;
    }catch(e){
      loginErr.textContent = 'Could not reach the server.';
      return false;
    }
  }

  document.getElementById('loginBtn').addEventListener('click', ()=>{
    apiKey = document.getElementById('apiKeyInput').value.trim();
    if(!apiKey){ document.getElementById('loginErr').textContent = 'Enter your admin API key.'; return; }
    tryLoad();
  });

  if(apiKey){ tryLoad(); }

  async function loadSettings(){
    try{
      const res = await fetch('/api/settings');
      const s = await res.json();
      document.getElementById('upiIdInput').value = s.upiId || '';
      document.getElementById('payeeNameInput').value = s.payeeName || '';
    }catch(e){}
  }

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('settingsMsg');
    msg.classList.remove('hidden');
    msg.textContent = 'Saving…';
    try{
      const res = await fetch('/api/admin/settings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify({
          upiId: document.getElementById('upiIdInput').value,
          payeeName: document.getElementById('payeeNameInput').value
        })
      });
      if(res.ok){ msg.textContent = 'Saved.'; }
      else{ msg.textContent = 'Could not save. Please check your API key.'; }
    }catch(e){ msg.textContent = 'Could not reach the server.'; }
  });

  async function loadStats(){
    try{
      const res = await fetch('/api/admin/stats', { headers: authHeaders() });
      const s = await res.json();
      document.getElementById('statBookings').textContent = s.totalBookings;
      document.getElementById('statOrders').textContent = s.totalOrders;
      document.getElementById('statPlates').textContent = s.totalPlates;
      document.getElementById('statAmount').textContent = '₹' + s.totalAmount.toLocaleString('en-IN');
      document.getElementById('statPaid').textContent = '₹' + s.paidAmount.toLocaleString('en-IN');
    }catch(e){}
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // Groups the flat list of day-orders into one array per bookingId,
  // preserving the order they arrived in (already newest-first from the API).
  function groupByBooking(orders){
    const map = new Map();
    for(const o of orders){
      const key = o.bookingId || o.orderId;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(o);
    }
    return Array.from(map.values());
  }

  function renderBookingGroup(group){
    const first = group[0];
    const totalAmount = group.reduce((s,o)=>s+o.amount, 0);
    const totalPlates = group.reduce((s,o)=>s+o.qty, 0);
    const allPaid = group.every(o => o.status === 'paid');
    const allPending = group.every(o => o.status === 'pending');
    const overallLabel = allPaid ? 'All paid' : (allPending ? 'All pending' : 'Partially paid');
    const overallClass = allPaid ? 'status-paid' : (allPending ? 'status-pending' : 'status-partial');
    const placed = new Date(first.createdAt).toLocaleString('en-IN');

    const wrap = document.createElement('div');
    wrap.className = 'booking-group';

    const utrLine = first.utr ? ` · UTR: ${escapeHtml(first.utr)}` : '';
    const screenshotLine = first.screenshotUrl
      ? ` · <a href="${first.screenshotUrl}" target="_blank" rel="noopener">View payment screenshot</a>`
      : '';

    wrap.innerHTML = `
      <div class="booking-header">
        <div class="binfo">
          <b>${escapeHtml(first.bookingId || first.orderId)}</b>
          <div class="booking-meta">${escapeHtml(first.name)} · ${escapeHtml(first.phone)} · ${escapeHtml(first.email)}</div>
          <div class="booking-meta">${escapeHtml(first.lunchType || '')} · Placed ${placed}${utrLine}${screenshotLine}</div>
        </div>
        <div class="booking-total">
          <span class="status-pill ${overallClass}">${overallLabel}</span>
          <div class="btotal-amt">₹${totalAmount.toLocaleString('en-IN')}</div>
          <div class="booking-meta">${totalPlates} plate(s) across ${group.length} day(s)</div>
        </div>
      </div>
      <table class="day-table">
        <thead>
          <tr><th>Day</th><th class="num">Plates</th><th class="num">Amount</th><th>Order ID</th><th>Status</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="booking-footer"></div>
    `;

    const tbody = wrap.querySelector('tbody');
    for(const o of group){
      const tr = document.createElement('tr');
      const pillClass = o.status === 'paid' ? 'status-paid' : 'status-pending';
      tr.innerHTML = `
        <td>${escapeHtml(o.day || '')}</td>
        <td class="num">${o.qty}</td>
        <td class="num">₹${o.amount.toLocaleString('en-IN')}</td>
        <td>${escapeHtml(o.orderId)}</td>
        <td><span class="status-pill ${pillClass}">${o.status}</span></td>
      `;
      const actionTd = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'ghost status-btn';
      btn.textContent = o.status === 'paid' ? 'Mark pending' : 'Mark paid';
      btn.addEventListener('click', () => toggleStatus(o.orderId, o.status));
      actionTd.appendChild(btn);
      tr.appendChild(actionTd);
      tbody.appendChild(tr);
    }

    const footer = wrap.querySelector('.booking-footer');
    if(first.bookingId){
      const bulkBtn = document.createElement('button');
      bulkBtn.className = 'secondary status-btn';
      bulkBtn.textContent = allPaid ? 'Mark whole booking pending' : 'Mark whole booking paid';
      bulkBtn.addEventListener('click', () => toggleBookingStatus(first.bookingId, allPaid));
      footer.appendChild(bulkBtn);
    }

    return wrap;
  }

  async function loadOrders(){
    const container = document.getElementById('ordersContainer');
    const errEl = document.getElementById('ordersErr');
    errEl.textContent = '';
    container.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">Loading…</p>';
    try{
      const res = await fetch('/api/admin/orders', { headers: authHeaders() });
      const data = await res.json();
      const orders = data.orders || [];
      if(orders.length === 0){
        container.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">No bookings yet.</p>';
        return;
      }
      const groups = groupByBooking(orders);
      container.innerHTML = '';
      for(const group of groups){
        container.appendChild(renderBookingGroup(group));
      }
    }catch(e){
      errEl.textContent = 'Could not load orders.';
      container.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">Could not load orders.</p>';
    }
  }

  async function toggleStatus(orderId, currentStatus){
    const newStatus = currentStatus === 'paid' ? 'pending' : 'paid';
    try{
      await fetch(`/api/admin/orders/${encodeURIComponent(orderId)}/status`, {
        method:'POST', headers: authHeaders(), body: JSON.stringify({ status: newStatus })
      });
      await loadStats();
      await loadOrders();
    }catch(e){}
  }

  async function toggleBookingStatus(bookingId, currentlyAllPaid){
    const newStatus = currentlyAllPaid ? 'pending' : 'paid';
    try{
      await fetch(`/api/admin/bookings/${encodeURIComponent(bookingId)}/status`, {
        method:'POST', headers: authHeaders(), body: JSON.stringify({ status: newStatus })
      });
      await loadStats();
      await loadOrders();
    }catch(e){}
  }

  document.getElementById('refreshBtn').addEventListener('click', ()=>{ loadStats(); loadOrders(); });

  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    try{
      const res = await fetch('/api/admin/orders/export', { headers: authHeaders() });
      if(!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bhog-orders.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){}
  });
})();
</script>
</body>
</html>
