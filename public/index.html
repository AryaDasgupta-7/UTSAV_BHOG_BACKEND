  :root{
    --ivory:#FBF3E6; --white:#FFFDF9; --red:#A5303A; --red-dark:#7A2029;
    --gold:#CE9B3F; --gold-soft:#E9CE9B; --teal:#1F4B3F; --ink:#2A1B14;
    --ink-soft:#6B5B4E; --line:#DECBAA; --error:#B0392F; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, rgba(206,155,63,0.18), transparent 55%), var(--ivory);
    color:var(--ink); font-family:'Work Sans', sans-serif; min-height:100vh;
    padding:56px 16px 64px; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{ width:100%; max-width:560px; position:relative; }
  .site-logo{
    position:absolute;
    top:-40px;
    left:-14px;
    width:88px;
    height:88px;
    border-radius:50%;
    background:var(--white);
    box-shadow:0 6px 18px rgba(122,32,41,0.22), 0 0 0 3px var(--white);
    object-fit:cover;
    z-index:5;
  }
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(42,27,20,0.06); overflow:hidden; position:relative;
  }
  .motif{ display:block; width:100%; height:auto; }
  .content{ padding:8px 34px 34px; }
  header{ text-align:center; padding:18px 0 22px; }
  header h1{
    font-family:'Fraunces', serif; font-optical-sizing:auto; font-weight:600;
    font-size:27px; line-height:1.25; margin:0 0 10px; color:var(--red-dark);
  }
  header p{ margin:0; color:var(--ink-soft); font-size:15px; line-height:1.5; }
  .divider{ display:flex; align-items:center; gap:10px; margin:26px 0 22px; color:var(--gold); }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  .divider svg{ width:16px; height:16px; flex:none; }
  label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field{ margin-bottom:18px; }
  input[type=text], input[type=tel], input[type=email]{
    width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px;
    background:var(--ivory); font-family:'Work Sans', sans-serif; font-size:15px;
    color:var(--ink); transition:border-color .15s;
  }
